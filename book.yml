# 책 전체 목차와 진행 상태의 단일 원본. 페이지를 쓰면 done: true로 바꾸고 `python3 tools/build_book.py`를 실행한다.
# 메뉴(mkdocs.yml의 nav)와 부/장 안내 페이지가 이 파일에서 자동으로 만들어진다.
# 뼈대: OpenStax World History Vol.1·2(CC BY-NC-SA 4.0) 목차. 대조: 2022 개정 세계사 교육과정, 하버드-C.H.베크 세계사(민음사).
# 범위: 선사 ~ 1991년. ★는 심화.
parts:
- id: 1
  title: I 인류, 문명을 만들다
  blurb: 역사를 어떻게 아는지부터 시작해, 첫 인류가 농사를 짓고 강가에 문명을 세우기까지를 따라가요.
  chapters:
  - num: 1
    title: 역사는 어떻게 알 수 있을까
    blurb: 과거를 직접 볼 수 없는데 어떻게 알까요? 증거와 연도를 읽는 법부터 익혀요.
    sections:
    - num: '1.1'
      title: 과거를 읽는 법
      pages:
      - {slug: what-is-history, title: "역사는 남은 흔적으로 과거를 다시 짜 맞추는 일", min: 5, done: true}
      - {slug: sources, title: "기록도 유물도 모두 증거예요", min: 5, done: true}
      - {slug: dates, title: "기원전과 기원후, 연도 읽는 법", min: 4, done: true}
  - num: 2
    title: 처음 사람들
    blurb: 아프리카에서 나온 인류가 세계로 퍼지고, 사냥하던 삶에서 농사짓는 삶으로 바뀌어요.
    sections:
    - num: '2.1'
      title: 떠도는 사람들
      pages:
      - {slug: out-of-africa, title: "현생 인류는 아프리카에서 나와 세계로 퍼졌다", min: 5, done: true}
      - {slug: paleolithic, title: "구석기 사람들은 사냥하고 모으며 옮겨 다녔다", min: 5, done: true}
      - {slug: cave-art, title: "동굴 벽화는 생각하는 인류의 흔적", min: 4, done: true}
    - num: '2.2'
      title: 머무는 사람들
      pages:
      - {slug: farming, title: "농사를 시작하자 한곳에 머물러 살게 됐다", min: 5, done: true}
      - {slug: villages, title: "마을이 커지며 가진 사람과 못 가진 사람이 생겼다", min: 5, done: true}
  - num: 3
    title: 강가에서 문명이 시작되다
    blurb: 큰 강가에 도시와 문자와 나라가 함께 생겨요. 메소포타미아, 이집트, 인더스, 황허를 둘러봐요.
    sections:
    - num: '3.1'
      title: 문명이란
      pages:
      - {slug: civilization, title: "문명은 도시, 문자, 나라가 함께 생긴 것", min: 5, done: true}
    - num: '3.2'
      title: 네 강의 문명
      pages:
      - {slug: mesopotamia, title: "메소포타미아, 두 강 사이에 도시가 섰다", min: 5, done: true}
      - {slug: cuneiform-law, title: "쐐기 문자와 함무라비 법전", min: 5, done: true}
      - {slug: egypt, title: "나일강이 이집트를 키웠다", min: 5, done: true}
      - {slug: pyramids, title: "피라미드는 파라오의 힘을 보여 준다", min: 5, done: true}
      - {slug: indus, title: "인더스 문명은 반듯한 계획도시를 지었다", min: 5, done: true}
      - {slug: shang, title: "황허 문명과 거북 껍데기에 새긴 글자", min: 5, done: true}
- id: 2
  title: II 고대 제국과 사상
  blurb: 기원전 1000년부터 기원후 500년까지. 큰 제국들이 생기고, 지금까지 이어지는 종교와 사상이 태어나요.
  chapters:
  - num: 4
    title: 생각이 태어난 시대
    blurb: 비슷한 때 여러 곳에서 '어떻게 살아야 할까'를 묻는 사상과 종교가 나와요.
    sections:
    - num: '4.1'
      title: 동쪽의 생각
      pages:
      - {slug: confucius, title: "공자는 예와 어진 마음으로 세상을 바로잡으려 했다", min: 5, done: true}
      - {slug: hundred-schools, title: "제자백가, 어지러운 세상을 고칠 방법을 겨루다", min: 5, done: true}
      - {slug: buddha, title: "석가모니는 괴로움에서 벗어나는 길을 찾았다", min: 5, done: true}
    - num: '4.2'
      title: 서쪽의 생각
      pages:
      - {slug: hebrews, title: "헤브라이인은 하나의 신을 믿었다", min: 5, done: true}
      - {slug: greek-philosophy, title: "그리스 철학자들은 '왜'를 물었다", min: 5, done: true}
  - num: 5
    title: 동아시아와 인도의 제국
    blurb: 중국을 처음 하나로 묶은 진·한, 불교를 퍼뜨린 인도의 왕조, 그리고 초원의 유목민을 만나요.
    sections:
    - num: '5.1'
      title: 중국과 초원
      pages:
      - {slug: qin, title: "진시황은 처음으로 중국을 하나로 묶었다", min: 5, done: true}
      - {slug: han-silk-road, title: "한나라 때 비단길이 열렸다", min: 5, done: true}
      - {slug: steppe, title: "초원의 유목민, 말 위에서 사는 사람들", min: 5, done: true}
    - num: '5.2'
      title: 인도
      pages:
      - {slug: ashoka, title: "아소카왕은 전쟁을 멈추고 불교를 널리 퍼뜨렸다", min: 5, done: true}
      - {slug: gupta, title: "굽타 왕조 때 힌두 문화가 자리 잡았다", min: 5, done: true}
  - num: 6
    title: 페르시아, 그리스, 로마
    blurb: 지중해 둘레에 세워진 나라들이에요. 시민이 다스린 도시에서 거대한 제국까지 이어져요.
    sections:
    - num: '6.1'
      title: 페르시아와 그리스
      pages:
      - {slug: persia, title: "페르시아는 여러 민족을 너그럽게 다스렸다", min: 5, done: true}
      - {slug: polis, title: "폴리스, 시민이 함께 다스린 도시", min: 5, done: true}
      - {slug: athens-democracy, title: "아테네 민주정, 그러나 모두가 시민은 아니었다", min: 5, done: true}
      - {slug: alexander, title: "알렉산드로스가 동서 문화를 섞었다", min: 5, done: true}
    - num: '6.2'
      title: 로마
      pages:
      - {slug: roman-republic, title: "로마 공화정, 왕 없이 나라를 다스리다", min: 5, done: true}
      - {slug: roman-empire, title: "로마 제국은 길과 법으로 넓은 땅을 다스렸다", min: 5, done: true}
      - {slug: christianity, title: "크리스트교가 로마 제국에 퍼졌다", min: 5, done: true}
      - {slug: rome-split, title: "로마는 너무 커서 둘로 나눠 다스렸다", min: 5, done: true}
  - num: 7
    title: 아프리카와 아메리카의 고대 문명
    blurb: 같은 시기 아프리카와 아메리카에서도 나라와 도시가 자랐어요.
    sections:
    - num: '7.1'
      title: 아프리카
      pages:
      - {slug: bantu, title: "반투족은 농사와 철을 들고 대륙을 가로질렀다", min: 5, done: true}
      - {slug: kush, title: "쿠시 왕국은 한때 이집트를 다스렸다", min: 5, done: true}
      - {slug: aksum, title: "악숨 왕국은 홍해 무역으로 부유해졌다", min: 5, done: true}
    - num: '7.2'
      title: 아메리카
      pages:
      - {slug: americas-settle, title: "사람들은 어떻게 아메리카에 건너갔을까", min: 5, done: true}
      - {slug: olmec-maya, title: "올멕과 마야, 아메리카의 도시와 문자", min: 5, done: true}
- id: 3
  title: III 종교와 교류의 시대
  blurb: 500년부터 1500년까지. 이슬람 세계와 몽골 제국이 넓은 땅을 이으면서 사람과 물건과 생각이 오가요.
