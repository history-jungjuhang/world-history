    - num: '8.1'
      title: 이슬람의 시작과 확장
      pages:
      - {slug: muhammad, title: "무함마드와 이슬람교의 시작", min: 5, done: true}
      - {slug: caliphate, title: "칼리프가 넓은 땅을 다스렸다", min: 5, done: true}
      - {slug: sunni-shia, title: "수니파와 시아파는 어떻게 갈라졌나", min: 5, done: true}
