- id: 5
  title: V 혁명과 제국주의
  blurb: 1750년부터 1914년까지. 시민 혁명과 산업 혁명이 세상을 바꾸고, 힘이 세진 나라들이 세계를 나눠 가지려 해요.
  chapters:
  - num: 16
    title: 시민 혁명과 국민 국가
    blurb: 왕이 아니라 국민이 나라의 주인이라는 생각이 대서양 양쪽에서 혁명을 일으켜요.
    sections:
    - num: '16.1'
      title: 혁명
      pages:
      - {slug: enlightenment, title: "계몽사상, 이성으로 세상을 바꿀 수 있다", min: 5, done: true}
      - {slug: american-revolution, title: "미국 혁명, 왕 없는 나라를 세우다", min: 5, done: true}
      - {slug: french-revolution, title: "프랑스 혁명과 인권 선언", min: 5, done: true}
      - {slug: haiti, title: "아이티 혁명, 노예였던 사람들이 나라를 세웠다", min: 5, done: true}
    - num: '16.2'
      title: 국민 국가
      pages:
      - {slug: latin-america, title: "라틴 아메리카가 독립했다", min: 5, done: true}
      - {slug: nationalism, title: "민족주의와 이탈리아·독일의 통일", min: 5, done: true}
  - num: 17
    title: 산업 혁명
    blurb: 기계와 공장이 일하는 방식과 사는 곳을 바꾸고, 새로운 문제와 생각도 함께 낳아요.
    sections:
    - num: '17.1'
      title: 기계의 시대
      pages:
      - {slug: industrial-revolution, title: "산업 혁명은 영국에서 시작됐다", min: 5, done: true}
      - {slug: factory-city, title: "공장과 도시, 달라진 사람들의 삶", min: 5, done: true}
      - {slug: socialism, title: "노동 운동과 사회주의가 나타났다", min: 5, done: true}
      - {slug: second-industrial, title: "제2차 산업 혁명, 전기와 석유의 시대", min: 5, done: true}
  - num: 18
    title: 제국주의와 아시아·아프리카의 대응
    blurb: 힘이 세진 나라들이 식민지를 넓히고, 아시아와 아프리카는 개혁과 저항으로 맞서요.
    sections:
    - num: '18.1'
      title: 제국주의
      pages:
      - {slug: imperialism, title: "제국주의, 힘센 나라들이 세계를 나눠 가지려 했다", min: 5, done: true}
      - {slug: scramble-africa, title: "유럽은 아프리카를 자로 그어 나눴다", min: 5, done: true}
      - {slug: british-india, title: "영국의 인도 지배와 인도 사람들의 저항", min: 5, done: true}
    - num: '18.2'
      title: 개혁과 저항
      pages:
      - {slug: opium-war, title: "아편 전쟁 뒤 청은 개혁에 나섰다", min: 5, done: true}
      - {slug: meiji, title: "메이지 유신, 일본이 서양식으로 바뀌다", min: 5, done: true}
      - {slug: ottoman-reform, title: "오스만 제국도 개혁으로 버티려 했다", min: 5, done: true}
- id: 6
  title: VI 세계 대전과 냉전
  blurb: 1914년부터 1991년까지. 두 번의 세계 대전과 냉전, 그리고 식민지였던 나라들의 독립이 오늘의 세계를 만들어요.
  chapters:
  - num: 19
    title: 제1차 세계 대전과 그 뒤
    blurb: 처음으로 온 세계가 휘말린 전쟁, 그리고 그 뒤에 온 혁명과 경제 위기를 봐요.
    sections:
    - num: '19.1'
      title: 첫 번째 세계 대전
      pages:
      - {slug: ww1-causes, title: "제1차 세계 대전은 왜 일어났나", min: 5, done: true}
      - {slug: total-war, title: "총력전, 나라 전체가 전쟁에 동원됐다", min: 5, done: true}
      - {slug: russian-revolution, title: "러시아 혁명으로 소련이 생겼다", min: 5, done: true}
    - num: '19.2'
      title: 전쟁 뒤의 세계
      pages:
      - {slug: self-determination, title: "민족 자결, 식민지 사람들이 희망을 품다", min: 5, done: true}
      - {slug: great-depression, title: "대공황이 세계 경제를 무너뜨렸다", min: 5, done: true}
  - num: 20
    title: 제2차 세계 대전
    blurb: 전체주의가 일으킨 전쟁과 그 피해, 그리고 다시는 그러지 말자며 만든 약속을 봐요.
    sections:
    - num: '20.1'
      title: 두 번째 세계 대전
      pages:
      - {slug: totalitarianism, title: "전체주의, 나라가 개인의 모든 것을 정하려 했다", min: 5, done: true}
      - {slug: ww2, title: "제2차 세계 대전은 유럽과 아시아에서 함께 벌어졌다", min: 5, done: true}
      - {slug: holocaust, title: "홀로코스트, 기억해야 할 학살", min: 5, done: true}
      - {slug: pacific-war, title: "태평양 전쟁과 원자 폭탄", min: 5, done: true}
      - {slug: united-nations, title: "국제 연합과 세계 인권 선언", min: 5, done: true}
  - num: 21
    title: 냉전과 새로 독립한 나라들
    blurb: 미국과 소련이 세계를 둘로 나누는 동안, 아시아와 아프리카의 많은 나라가 독립해요. 1991년 소련 해체까지 봐요.
    sections:
    - num: '21.1'
      title: 냉전
      pages:
      - {slug: cold-war, title: "냉전, 총을 쏘지 않은 대결", min: 5, done: true}
      - {slug: korean-war, title: "6·25 전쟁, 냉전이 뜨거워진 곳", min: 5, done: true}
      - {slug: cold-war-end, title: "베를린 장벽이 무너지고 소련이 해체됐다", min: 5, done: true}
    - num: '21.2'
      title: 독립과 권리
      pages:
      - {slug: decolonization, title: "아시아와 아프리카의 나라들이 독립했다", min: 5, done: true}
      - {slug: non-aligned, title: "어느 편에도 서지 않겠다는 비동맹 운동", min: 5, done: true}
      - {slug: civil-rights, title: "차별에 맞선 인권 운동", min: 5, done: true}
