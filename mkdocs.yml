site_name: 세계사 정주행
site_description: 열 살도 이해하는 세계사. 선사 시대부터 냉전이 끝난 1991년까지, 아시아·아프리카·아메리카·유럽을 고르게 다루는 한국어 웹 교과서
site_url: https://history-jungjuhang.github.io/world-history/
copyright: 세계사 정주행 · 뼈대 목차는 OpenStax World History(CC BY-NC-SA 4.0)를 참고해 새로 썼어요
theme:
  name: material
  logo: assets/globe-logo.svg
  favicon: assets/globe-logo.svg
  language: ko
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - toc.follow
  font: false
  palette:
    - scheme: default
      primary: custom
      accent: custom
      toggle: {icon: material/weather-night, name: 다크 모드}
    - scheme: slate
      primary: custom
      accent: custom
      toggle: {icon: material/weather-sunny, name: 라이트 모드}
extra_css:
  - https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css
  - https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap
  - stylesheets/extra.css
extra_javascript:
  - javascripts/globe.js
  - javascripts/reveal.js
markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed: {alternate_style: true}
  - attr_list
  - pymdownx.mark: {smart_mark: false}
  - md_in_html
  - tables
  - toc: {permalink: true}
